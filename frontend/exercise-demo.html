<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>运动锻炼小游戏 · 原型试玩</title>
  <link rel="stylesheet" href="game.css">
  <link rel="stylesheet" href="exercise-minigame.css?v=2">
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#eef7f5;margin:0;padding:24px;color:#2f6679}
    .wrap{max-width:640px;margin:0 auto}
    h1{font-size:22px;margin:0 0 4px}
    .sub{color:#64818b;font-size:13px;margin:0 0 18px;line-height:1.6}
    .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
    button{font-family:inherit;border:0;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer}
    .b-primary{background:#377f98;color:#fff8dc}
    .b-ghost{background:#e3eef0;color:#2f6679}
    .panel{background:#fff;border-radius:14px;padding:16px;box-shadow:0 8px 24px rgba(20,50,60,.12)}
    pre{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.6;color:#3c7280;margin:0}
    .ok{color:#4f7d59}.bad{color:#b5523f}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>运动锻炼 · 节奏训练原型</h1>
    <p class="sub">独立试玩页（不依赖主游戏）。点「开始试玩」进入 20 秒 / 最多 5 次判定；指针进入判定区时点击屏幕或按空格。点「运行自检」可校验判定区生成与命中逻辑。</p>
    <div class="bar">
      <button class="b-primary" id="play">开始试玩</button>
      <button class="b-ghost" id="selftest">运行自检</button>
    </div>
    <div class="panel"><pre id="out">等待操作…</pre></div>
  </div>

  <script src="exercise-minigame.js?v=2"></script>
  <script>
    const out = document.getElementById("out");
    document.getElementById("play").addEventListener("click", function () {
      out.textContent = "已进入小游戏，去点吧～";
      window.ExerciseMinigame.start(function (result) {
        out.textContent = "结算结果：\n" + JSON.stringify(result, null, 2);
      });
    });
    document.getElementById("selftest").addEventListener("click", function () {
      const r = window.ExerciseMinigame.runSelfTest();
      const head = "自检：通过 " + r.passed + " / 失败 " + r.failed + "\n\n";
      out.innerHTML = head + r.cases.map(function (c) {
        return c.startsWith("PASS") ? '<span class="ok">' + c + "</span>" : '<span class="bad">' + c + "</span>";
      }).join("\n");
    });
  </script>
</body>
</html>
