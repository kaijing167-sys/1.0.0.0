<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>专注学习小游戏 · 课堂小测试玩</title>
  <link rel="stylesheet" href="game.css">
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#eef7f5;margin:0;padding:24px;color:#2f6679}
    .wrap{max-width:640px;margin:0 auto}
    h1{font-size:22px;margin:0 0 4px}
    .sub{color:#64818b;font-size:13px;margin:0 0 18px;line-height:1.6}
    .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
    button{font-family:inherit;border:0;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer}
    .b-primary{background:#377f98;color:#fff8dc}
    .panel{background:#fff;border-radius:14px;padding:16px;box-shadow:0 8px 24px rgba(20,50,60,.12)}
    pre{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.6;color:#3c7280;margin:0}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>专注学习 · 课堂小测（像素风）</h1>
    <p class="sub">独立试玩页（不依赖主游戏）。点「开始试玩」进入 20 秒 / 10 道二十以内加减法限时小测。题目数字与计分逻辑与正式版完全一致，此处仅预览像素风视觉。</p>
    <div class="bar">
      <button class="b-primary" id="play">开始试玩</button>
    </div>
    <div class="panel"><pre id="out">等待操作…</pre></div>
  </div>

  <script>
    /* stub：对齐 game.js 的弹窗接口，供 study-minigame.js 独立运行 */
    window.openModal = function (html) {
      var old = document.getElementById("game-dialog");
      if (old && old.parentNode) old.parentNode.removeChild(old);
      var dlg = document.createElement("div");
      dlg.className = "game-dialog";
      dlg.id = "game-dialog";
      dlg.innerHTML = '<div class="dialog-card">' + html + "</div>";
      document.body.appendChild(dlg);
    };
    window.closeModal = function () {
      var d = document.getElementById("game-dialog");
      if (d && d.parentNode) d.parentNode.removeChild(d);
    };
  </script>
  <script src="study-minigame.js?v=2"></script>
  <script>
    const out = document.getElementById("out");
    document.getElementById("play").addEventListener("click", function () {
      out.textContent = "已进入小测，加油～";
      window.StudyMinigame.start("数学", function (correct, total) {
        out.textContent = "结算结果：答对 " + correct + " / " + total + " 题";
      });
    });
  </script>
</body>
</html>
